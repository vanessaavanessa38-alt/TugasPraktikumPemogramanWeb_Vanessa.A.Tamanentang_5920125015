<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Page Sederhana</title>
<style>
  :root {
    --bg: #0f2a43;
    --bg2: #1d6f6b;
    --text: #ffffff;
    --accent: #ffb703;
    --accent-text: #1a1a1a;
    --menu-bg: #ffffff;
    --menu-text: #12263a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 6vw;
    position: relative;
    z-index: 10;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }
  .logo img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}


  nav ul {
    list-style: none;
    display: flex;
    gap: 28px;
    margin: 0;
    padding: 0;
  }
  nav li { position: relative; }
  nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 8px 0;
    display: inline-block;
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); outline: none; }

  /* Dropdown */
  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 170px;
    background: var(--menu-bg);
    border-radius: 8px;
    padding: 8px 0;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .dropdown a {
    display: block;
    color: var(--menu-text);
    padding: 10px 18px;
  }
  .dropdown a:hover { background: #eef3f7; color: var(--menu-text); }
  .has-dropdown:hover .dropdown,
  .has-dropdown:focus-within .dropdown { display: block; }

  /* ===== BODY ===== */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 6vw;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .hero { max-width: 640px; }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin: 0 0 16px;
  }
  .hero p {
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0 0 28px;
    opacity: .9;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 999px;
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* Mobile */
  @media (max-width: 720px) {
    header { flex-direction: column; gap: 12px; }
    nav ul { flex-wrap: wrap; justify-content: center; gap: 8px 18px; }
    .dropdown { left: 50%; transform: translateX(-50%); }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#"><img src="logo.jpeg" alt="Logo Sistem dan Teknologi Informasi">STI</a>
  <nav>
    <ul>
      <li><a href="#">Beranda</a></li>
      <li class="has-dropdown">
        <a href="#">Layanan &#9662;</a>
        <div class="dropdown">
          <a href="#">Kelas Online</a>
          <a href="#">Konsultasi</a>
          <a href="#">Pelatihan</a>
        </div>
      </li>
      <li><a href="#">Tentang</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="hero">
    <h1>Welcome To STI</h1>
    <p>Kuasai HTML dan CSS dari dasar dengan materi singkat, jelas, dan mudah dipraktikkan.</p>
    <a href="#" class="btn">Daftar</a>
  </div>
</main>

</body>
</html>
